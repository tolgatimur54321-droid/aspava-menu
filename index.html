<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SİMA - FIRIN • PİDE • IZGARA | Menü</title>
  <meta name="description" content="SİMA QR Menü. Taş Fırından taze lezzetler, Aspava, tatlı ve içecek çeşitleri.">
  <meta name="theme-color" content="#331f17">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/placeholder.svg">

  <!-- Google Fonts: Playfair Display (Başlıklar) + Plus Jakarta Sans (Gövde) + Caveat (Zarif El Yazısı) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Ana Stil Dosyası -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- 1. ÜST BAŞLIK BÖLÜMÜ (Header) -->
    <header class="header">
      <!-- Arka Plan Zarif Botanik Süslemeleri -->
      <div class="header-decor decor-left"></div>
      <div class="header-decor decor-right"></div>

      <!-- Sağ Üst El Yazısı Notu -->
      <div class="header-top-row">
        <div class="note-script" id="note-top-right">İyi Yemek Güzel İnsanları Buluşturur.</div>
      </div>

      <!-- Logo & Marka -->
      <div class="brand-wrap">
        <h1 class="brand-title" id="brand-name">SİMA</h1>
        
        <div class="tagline-row">
          <span class="tagline-line"></span>
          <span class="brand-tagline" id="brand-tagline">FIRIN • PİDE • IZGARA</span>
          <span class="tagline-line"></span>
        </div>

        <p class="slogan-script" id="slogan-text">Lezzetin her hali, SİMA'da.</p>
      </div>
    </header>

    <!-- 2. YAPIŞKAN (STICKY) 4 KATEGORİ ÇUBUĞU -->
    <div class="sticky-nav-wrapper">
      <nav id="category-nav" class="category-nav" aria-label="Menü Kategorileri">
        <!-- JavaScript ile 4 kategori dinamik yüklenecektir -->
      </nav>
    </div>

    <!-- 3. MENÜ İÇERİĞİ -->
    <main id="menu-container" class="menu-container">
      <!-- JavaScript ile 4 kategori ve ürünler dinamik yüklenecektir -->
    </main>

    <!-- 4. TAŞ FIRIN VURGUSU & SÜSLEME ALANI -->
    <div class="oven-banner">
      <div class="oven-bg-overlay"></div>
      <div class="oven-banner-text">
        <span class="oven-script">Taş Fırının<br>Eşsiz Lezzeti</span>
      </div>
    </div>

    <!-- 5. SADELEŞTİRİLMİŞ ALT BÖLÜM (Footer) -->
    <footer class="footer">
      <h2 class="footer-brand" id="footer-brand">SİMA</h2>
      <p class="footer-tagline" id="footer-tagline">FIRIN • PİDE • IZGARA</p>
    </footer>

  </div>

  <!-- Menü Yönetim Scripti -->
  <script src="js/menu.js"></script>
</body>
</html>
